name: Compilar APK autonoma turco-espanol
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # Los runners ubuntu-latest ya incluyen Android SDK cmdline-tools.
      - name: Comprobar SDK Android preinstalado
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Instalar Android SDK/NDK/CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Instalar Python para exportar ONNX
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.44.2' 'optimum[onnxruntime]==1.23.3' 'onnx==1.17.0' 'sentencepiece==0.2.0'
      - name: Preparar libreria JNI
        run: bash scripts/preparar_terceros.sh
      - name: Obtener modelos y exportar NMT antes de construir la APK
        run: bash scripts/preparar_modelos.sh
      - name: Asegurar que la APK contiene modelos offline
        run: python scripts/verificar_assets.py
      - name: Compilar APK depuracion firmada
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VisorTurcoEspanol-APK-offline-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


